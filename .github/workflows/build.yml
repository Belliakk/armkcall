name: Build unsigned IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Stable Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Clean Cache and Build
        run: |
          # Принудительно очищаем кэш перед сборкой
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          xcodebuild clean build \
            -project armkcall.xcodeproj \
            -scheme armkcall \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            -derivedDataPath ./build

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv ./build/Build/Products/Release-iphoneos/armkcall.app Payload/
          zip -r armkcall.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: armkcall-ipa
          path: armkcall.ipa
